
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Багш нэвтрэх | ZAAN Learning</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f8f7ff;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(133,87,255,.14), transparent 38%),
                radial-gradient(ellipse at 85% 85%, rgba(117,66,237,.10), transparent 35%),
                #100f16;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid rgba(167,139,250,.20);
            border-radius: 24px;
            background: linear-gradient(145deg,#231d33,#16141f);
            box-shadow: 0 30px 90px rgba(0,0,0,.35);
        }

        .brand {
            text-align: center;
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 32px;
        }

        .accent { color: #b99aff; }

        .icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            border-radius: 16px;
            background: linear-gradient(135deg,#b18aff,#7542ed);
            font-size: 27px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            margin: 12px 0 28px;
            color: #aaa1bc;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }

        label {
            display: block;
            margin: 17px 0 9px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(167,139,250,.22);
            border-radius: 11px;
            outline: none;
            background: #100f18;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #a78bfa;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(135deg,#b18aff,#7542ed);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 22px;
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .back {
            display: block;
            margin-top: 25px;
            color: #b99aff;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            ZAAN<span class="accent">Learning</span>
        </div>

        <div class="icon">♙</div>

        <h1>Багш нэвтрэх</h1>

        <p class="subtitle">
            Багшийн бүртгэлээрээ нэвтэрч,
            судалгаа болон тайлангийн системд хандаарай.
        </p>

        <form id="teacher-login-form">
            <label for="email">Имэйл хаяг</label>
            <input
                id="email"
                type="email"
                placeholder="name@orgil.edu.mn"
                autocomplete="username"
                required
            >

            <label for="password">Нууц үг</label>
            <input
                id="password"
                type="password"
                placeholder="Нууц үгээ оруулна уу"
                autocomplete="current-password"
                required
            >

            <button id="login-button" type="submit">
                Нэвтрэх →
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <a class="back" href="./portal.html">
            ← Нэвтрэх сонголт руу буцах
        </a>
    </main>

    <script type="module">
        import { supabase } from './supabase.js';

        const form = document.getElementById('teacher-login-form');
        const button = document.getElementById('login-button');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = 'Шалгаж байна...';
            message.textContent = '';

            try {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                const { data: roleData, error: roleError } = await supabase
                    .from('user_roles')
                    .select('role')
                    .eq('user_id', data.user.id)
                    .maybeSingle();

                if (roleError) throw roleError;

                if (roleData?.role !== 'teacher') {
                    await supabase.auth.signOut();
                    throw new Error('Энэ бүртгэл багшийн эрхгүй байна. Админтай холбогдоно уу.');
                }

                message.style.color = '#86efac';
                message.textContent = 'Амжилттай нэвтэрлээ.';

                window.location.replace('./teacher-dashboard.html');

            } catch (error) {
                message.style.color = '#fca5a5';
                message.textContent = error.message || 'Нэвтрэхэд алдаа гарлаа.';
            } finally {
                button.disabled = false;
                button.textContent = 'Нэвтрэх →';
            }
        });
    </script>
</body>
</html>
