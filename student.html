
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сурагч нэвтрэх | Zaan Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f8f7ff;
            background:
                radial-gradient(
                    ellipse at 20% 20%,
                    rgba(133, 87, 255, 0.14),
                    transparent 40%
                ),
                #100f16;
        }

        .student-login {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            border: 1px solid rgba(167, 139, 250, 0.22);
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                rgba(35, 29, 51, 0.98),
                rgba(22, 20, 31, 0.98)
            );
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, #b18aff, #7542ed);
            box-shadow: 0 6px 24px rgba(117, 66, 237, 0.3);
        }

        .brand-accent {
            color: #b99aff;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #b99aff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 29px;
            line-height: 1.3;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #aaa1bc;
            font-size: 13px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #e8e2f4;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            outline: none;
            background: #201b2d;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(133, 87, 255, 0.12);
        }

        input::placeholder {
            color: #827991;
        }

        .submit-button {
            width: 100%;
            margin-top: 26px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(110deg, #9068ff, #7042ed);
            box-shadow: 0 8px 28px rgba(117, 72, 245, 0.2);
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(117, 72, 245, 0.3);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #message {
            min-height: 20px;
            margin: 16px 0 0;
            color: #c4b5fd;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-links a {
            color: #b99aff;
            font-size: 12px;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #fff;
        }

        @media (max-width: 480px) {
            .student-login {
                padding: 26px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .submit-button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="student-login">
        <a class="brand" href="./index.html">
            <span class="brand-mark">E</span>
            <span>Zaan <span class="brand-accent">Learning</span></span>
        </a>

        <p class="eyebrow">STUDENT PORTAL</p>
        <h1>Суралцагчийн нэвтрэх хэсэг</h1>
        <p class="subtitle">
            Имэйл болон нууц үгээрээ нэвтэрч,
            хичээлээ үргэлжлүүлэн суралцаарай.
        </p>

        <form id="student-login-form">
            <label for="student-email">Имэйл хаяг</label>
            <input
                id="student-email"
                type="email"
                autocomplete="username"
                placeholder="Имэйл хаягаа оруулна уу"
                required
            >

            <label for="student-password">Нууц үг</label>
            <input
                id="student-password"
                type="password"
                autocomplete="current-password"
                placeholder="Нууц үгээ оруулна уу"
                required
            >

            <button class="submit-button" id="student-login-button" type="submit">
                Нэвтрэх →
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <div class="footer-links">
            
            <a href="./portal.html"></a>
        </div>
    </main>

    <script type="module">
        import { supabase } from './supabase.js';

        const form = document.getElementById('student-login-form');
        const button = document.getElementById('student-login-button');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            button.disabled = true;
            message.textContent = 'Нэвтэрч байна...';

            const email = document.getElementById('student-email').value.trim();
            const password = document.getElementById('student-password').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                const { data: roleData, error: roleError } = await supabase
                    .from('user_roles')
                    .select('role')
                    .eq('user_id', data.user.id)
                    .maybeSingle();

                if (roleError) throw roleError;

                if (roleData?.role !== 'student') {
                    await supabase.auth.signOut();
                    throw new Error(
                        'Энэ хэрэглэгч сурагчийн эрхгүй байна.'
                    );
                }

                window.location.href = './index.html';
            } catch (error) {
                message.textContent =
                    error.message || 'Нэвтрэх үед алдаа гарлаа.';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
