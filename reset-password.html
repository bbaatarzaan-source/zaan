
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нууц үг сэргээх | ExamWeb</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f8f7ff;
            background:
                radial-gradient(ellipse at 15% 15%, #6535b52b, transparent 40%),
                radial-gradient(ellipse at 85% 85%, #4d2ba52b, transparent 35%),
                #100e18;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            border: 1px solid #ffffff18;
            border-radius: 20px;
            background: linear-gradient(145deg, #201c2b, #17141f);
            box-shadow: 0 30px 100px #0005;
        }

        .logo {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            border-radius: 13px;
            background: linear-gradient(140deg, #b59aff, #6336db);
            font-size: 23px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 27px;
        }

        .description {
            margin-bottom: 26px;
            color: #a49bb7;
            font-size: 13px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 12px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ffffff20;
            border-radius: 9px;
            outline: none;
            background: #100e18;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #9b7aff;
            box-shadow: 0 0 0 3px #8557ff20;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(100deg, #966cff, #7041e8);
            color: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            color: #fbbfbd;
            font-size: 12px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #message.success { color: #86efac; }

        .back {
            display: block;
            margin-top: 24px;
            color: #c4b5fd;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
        }

        .back:hover { color: white; }

        .hidden { display: none; }

        @media (max-width: 480px) {
            .card { padding: 26px 22px; }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">E</div>

        <section id="request-section">
            <h1>Нууц үгээ мартсан уу?</h1>
            <p class="description">
                Бүртгэлтэй имэйл хаягаа оруулна уу.
                Нууц үгээ шинэчлэх холбоос илгээх болно.
            </p>

            <form id="reset-request-form">
                <label for="email">Имэйл хаяг</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="name@example.com"
                    required
                >

                <button id="request-button" type="submit">
                    Сэргээх холбоос илгээх
                </button>
            </form>
        </section>

        <section id="new-password-section" class="hidden">
            <h1>Шинэ нууц үг</h1>
            <p class="description">
                Бүртгэлдээ ашиглах шинэ нууц үгээ хоёр удаа оруулна уу.
            </p>

            <form id="new-password-form">
                <label for="new-password">Шинэ нууц үг</label>
                <input
                    type="password"
                    id="new-password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="8-аас доошгүй тэмдэгт"
                    required
                >

                <label for="confirm-password">Нууц үг давтах</label>
                <input
                    type="password"
                    id="confirm-password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Шинэ нууц үгээ дахин оруулна уу"
                    required
                >

                <button id="save-button" type="submit">
                    Шинэ нууц үг хадгалах
                </button>
            </form>
        </section>

        <p id="message" role="status" aria-live="polite"></p>

        <a class="back" href="./login.html">
            ← Нэвтрэх хуудас руу буцах
        </a>
    </main>

    <script type="module">
        import { supabase } from './supabase.js';

        const requestSection = document.getElementById('request-section');
        const passwordSection = document.getElementById('new-password-section');
        const requestForm = document.getElementById('reset-request-form');
        const passwordForm = document.getElementById('new-password-form');
        const requestButton = document.getElementById('request-button');
        const saveButton = document.getElementById('save-button');
        const message = document.getElementById('message');

        function showMessage(text, success = false) {
            message.textContent = text;
            message.className = success ? 'success' : '';
        }

        // Имэйлээр нууц үг сэргээх холбоос илгээх
        requestForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            requestButton.disabled = true;
            showMessage('Имэйл илгээж байна...', true);

            const email = document.getElementById('email').value.trim();

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: window.location.origin +
                            window.location.pathname
                    }
                );

                if (error) throw error;

                showMessage(
                    'Хэрэв энэ имэйл бүртгэлтэй бол нууц үг сэргээх холбоос илгээгдэнэ. Имэйл болон Spam хавтсаа шалгана уу.',
                    true
                );
            } catch (error) {
                showMessage(error.message || 'Имэйл илгээхэд алдаа гарлаа.');
            } finally {
                requestButton.disabled = false;
            }
        });

        // Имэйл дэх холбоосоор ирсэн хэрэглэгч шинэ нууц үг тохируулна
        
async function checkRecoverySession() {
    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, '')
    );

    const recoveryError =
        params.get('error_description') ||
        hashParams.get('error_description');

    if (recoveryError) {
        showMessage(
            'Сэргээх холбоос хүчингүй эсвэл хугацаа нь дууссан байна. Шинэ холбоос хүснэ үү.'
        );
        return;
    }

    // Supabase-ийн PKCE хэлбэрийн холбоос
    const code = params.get('code');

    if (code) {
        const { error } =
            await supabase.auth.exchangeCodeForSession(code);

        if (error) {
            showMessage(
                'Холбоос хүчингүй эсвэл хугацаа нь дууссан байна. Шинэ холбоос хүснэ үү.'
            );
            return;
        }

        requestSection.classList.add('hidden');
        passwordSection.classList.remove('hidden');
        showMessage('Шинэ нууц үгээ оруулна уу.', true);
        return;
    }

    // Token хэлбэрийн холбоос
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const recoveryType = hashParams.get('type');

    if (
        accessToken &&
        refreshToken &&
        recoveryType === 'recovery'
    ) {
        const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
        });

        if (error) {
            showMessage(
                'Холбоос хүчингүй эсвэл хугацаа нь дууссан байна. Шинэ холбоос хүснэ үү.'
            );
            return;
        }

        requestSection.classList.add('hidden');
        passwordSection.classList.remove('hidden');
        showMessage('Шинэ нууц үгээ оруулна уу.', true);
        return;
    }

    // Хуудас нээгдэхэд сэргээх сесс байгаа эсэхийг шалгах
    const { data, error } = await supabase.auth.getSession();

    if (error) {
        showMessage('Сесс шалгахад алдаа гарлаа. Шинэ холбоос хүснэ үү.');
        return;
    }

    if (data.session && recoveryType === 'recovery') {
        requestSection.classList.add('hidden');
        passwordSection.classList.remove('hidden');
        showMessage('Шинэ нууц үгээ оруулна уу.', true);
    }
}


        await checkRecoverySession();

        // Шинэ нууц үгийг хадгалах
        passwordForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('new-password').value;
            const confirmation =
                document.getElementById('confirm-password').value;

            if (password.length < 8) {
                showMessage('Нууц үг хамгийн багадаа 8 тэмдэгт байх ёстой.');
                return;
            }

            if (password !== confirmation) {
                showMessage('Хоёр нууц үг хоорондоо таарахгүй байна.');
                return;
            }

            saveButton.disabled = true;
            showMessage('Шинэ нууц үгийг хадгалж байна...', true);

            try {
                const { data: sessionData } =
                    await supabase.auth.getSession();

                if (!sessionData.session) {
                    throw new Error(
                        'Сэргээх сесс олдсонгүй. Шинэ холбоос хүсэж дахин оролдоно уу.'
                    );
                }

                const { error } = await supabase.auth.updateUser({
                    password
                });

                if (error) throw error;

                await supabase.auth.signOut();

                showMessage(
                    'Нууц үг амжилттай шинэчлэгдлээ. Нэвтрэх хуудас руу шилжиж болно.',
                    true
                );

                passwordForm.reset();
                saveButton.disabled = true;
            } catch (error) {
                showMessage(
                    error.message || 'Нууц үг шинэчлэхэд алдаа гарлаа.'
                );
                saveButton.disabled = false;
            }
        });
    </script>
</body>
</html>
